services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: pd2_portal
      MYSQL_USER: pd2
      MYSQL_PASSWORD: pd2
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  app:
    build: .
    environment:
      PD2_MYSQL_DSN: mysql+asyncmy://pd2:pd2@mysql:3306/pd2_portal?charset=utf8mb4
      PD2_CORS_ORIGINS: '["*"]'
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

volumes:
  mysql_data:
